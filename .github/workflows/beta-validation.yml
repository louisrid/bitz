name: Stakkz beta validation
on:
  push:
    branches:
      - beta-ui-bots-account-sync-20261111
  pull_request:
    branches:
      - main
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax-check game and server modules
        run: |
          node --check server.js
          node --check src/core.js
          node --check src/bots.js
          node --check src/auth.js
          node --check public/engine.js
      - name: Beta smoke tests
        run: node tests/beta-smoke.mjs
      - name: Six-player game modes, station travel, hotels and final chaos
        run: node tests/gameplay-finalisation.mjs
      - name: Server, persistent storage and cross-device integration
        run: node tests/integration.mjs
      - name: Long-running bot gameplay simulations
        run: node tests/bot-simulation.mjs
      - name: Two-device reconnect and offline grace behaviour
        run: node tests/reconnect-grace.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - name: Confirm headless Chrome is installed
        run: google-chrome --version
      - name: Test desktop UI and iPhone account-to-game handoff
        run: node tests/browser-smoke.mjs
      - name: Save screenshot evidence for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stakkz-beta-layout-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      pg:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-password
          POSTGRES_DB: stakkz_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAKKZ_DATABASE_URL: postgres://postgres:qa-only-password@127.0.0.1:5432/stakkz_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test rolling-deploy data integrity against real PostgreSQL
        run: node tests/postgres-rollover.mjs

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - name: Render the real WebGL board and Profile on desktop and iPhone-sized Chrome
        run: node tests/visual-stage.mjs
        continue-on-error: true
      - name: Upload actual 3D scene screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stakkz-webgl-visual-check
          path: qa-3d-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [smoke, browser, postgres]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the real Render beta with its private Postgres database
        run: node tests/staging-live-smoke.mjs
