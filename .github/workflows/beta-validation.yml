name: BITZ validation
on:
  push:
    branches: [wip/game-rebuild]
  pull_request:
    branches: [main]
concurrency:
  group: bitz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax-check every active module
        run: |
          for f in server.js src/*.js public/*.js tools/econ-sim.mjs; do node --check "$f"; done
      - name: Roster, packs, odds, serials, book, trades, clubs, milestones, Dealer, friends
        run: node tests/cards-unit.mjs
      - name: Real server, socket earnings, stands, accounts, trades, persistence
        run: node tests/integration.mjs
      - name: Economy simulation (short)
        run: node tools/econ-sim.mjs 200
  desktop-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: "Desktop and iPhone-sized Chrome: loading, world, packs, book, buyer, profiles, no overlaps"
        run: node tests/browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitz-browser-screens
          path: qa-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
  postgres-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      pg:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-password
          POSTGRES_DB: stakkz_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAKKZ_DATABASE_URL: postgres://postgres:qa-only-password@127.0.0.1:5432/stakkz_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Postgres persistence through a rolling deploy
        run: node tests/postgres-rollover.mjs
      - name: Overlapping writers cannot destroy newer accounts
        run: node tests/postgres-overlap.mjs
