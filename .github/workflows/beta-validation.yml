name: BITZ 2.0 validation
on:
  push:
    branches: [feature/bitz-2-minimal-social, feature/football-cards-collections]
  pull_request:
    branches: [main]
concurrency:
  group: bitz2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax-check all active server and gameplay modules
        run: |
          node --check server.js
          node --check src/core.js
          node --check src/social.js
          node --check src/progression.js
          node --check src/shop.js
          node --check src/auth.js
          node --check public/voxel-world.js
          node --check public/world-layout.js
          node --check public/loot-rules.js
          node --check src/football.js
          node --check src/football-catalogue.js
          node --check public/football-ui.js
          node --check scripts/sync-football-media.mjs
      - name: Economy, levels, loot fairness and archived-feature protection
        run: node tests/bitz2-unit.mjs
      - name: Football album, guaranteed packs, quests, trades and rarity tests
        run: node tests/football-unit.mjs
      - name: Live multiplayer, signup, friends, buying and persistence
        run: node tests/bitz2-integration.mjs
      - name: Football cards API, offers, and account persistence
        run: node tests/football-integration.mjs
  desktop-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - name: Test desktop and mobile WebGL, menus and no overlap
        run: node tests/bitz2-browser.mjs
      - name: Football card shop, pack ripping, album and mobile layouts
        run: node tests/football-browser.mjs
      - name: Upload BITZ 2.0 UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitz2-browser-layouts
          path: qa-bitz2/*.png
          if-no-files-found: ignore
          retention-days: 7
  postgres-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      pg:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-password
          POSTGRES_DB: stakkz_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAKKZ_DATABASE_URL: postgres://postgres:qa-only-password@127.0.0.1:5432/stakkz_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test Postgres persistence through rolling deploy
        run: node tests/postgres-rollover.mjs
      - name: Test overlapping writers cannot destroy newer accounts
        run: node tests/postgres-overlap.mjs
