name: Cache licensed football portraits
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  push:
    branches: [feature/football-cards-collections, main]
    paths:
      - src/football-catalogue.js
      - scripts/sync-football-media.mjs
      - .github/workflows/football-media.yml
permissions:
  contents: write
concurrency:
  group: football-portrait-cache
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch reusable footballer portraits and licences
        run: node scripts/sync-football-media.mjs --limit=294
      - name: Preserve image source and attribution in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/football/media.json public/football/CREDITS.md public/football/portraits
          if ! git diff --cached --quiet; then
            git commit -m "chore(cards): cache licensed football portraits and credits"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
