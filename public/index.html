<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>BITZ</title>
<meta name="description" content="BITZ: a multiplayer football-card collecting game. Earn cash, open packs, complete clubs, trade with friends and climb the net worth leaderboard.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0f'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='38' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/coolvetica.otf" as="font" type="font/otf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="bitz.css?v=5">
</head>
<body>
<div id="load" aria-live="polite" aria-label="Loading BITZ">
  <div class="scene"><div class="lpk"><i></i><b>BITZ</b></div><div class="lc" style="--i:0" data-l="B"></div><div class="lc" style="--i:1" data-l="I"></div><div class="lc" style="--i:2" data-l="T"></div><div class="lc" style="--i:3" data-l="Z"></div><div class="lc" style="--i:4" data-l="★"></div></div>
  <div class="status">Starting</div>
</div>
<canvas id="gl" aria-label="The BITZ world"></canvas>
<div id="hud">
  <div id="hud-tl">
    <div id="hud-cash" class="panel cash" aria-label="Cash"><i class="coin"></i><b>$0</b></div>
    <div id="hud-lvl" class="panel" aria-label="Level"><b id="hud-level">1</b><span class="bar" id="hud-xp"><i></i></span></div>
    <div id="hud-zone" class="panel"></div>
  </div>
  <div id="hud-tr"><button id="board-mini" class="panel" aria-label="Net worth leaderboard"><h4>NET WORTH</h4></button></div>
  <div id="feed" aria-live="polite"></div>
  <div id="stick" aria-hidden="true"><i></i></div>
  <button id="btn-jump" aria-label="Jump">↑</button>
  <div id="hud-bottom">
    <button id="btn-menu" class="btn xl">MENU</button>
    <button id="btn-act" class="btn xl go" hidden></button>
  </div>
</div>
<div id="ui"></div>
<div id="toasts" aria-live="polite"></div>
<script src="three.min.js"></script>
<script src="world-layout.js?v=3"></script>
<script src="avatar-data.js?v=2"></script>
<script src="avatar.js?v=3"></script>
<script src="world.js?v=6"></script>
<script src="portraits/manifest.js?v=1"></script>
<script src="cards-art.js?v=5"></script>
<script src="cards-ui.js?v=3"></script>
<script src="app.js?v=6"></script>
</body>
</html>
