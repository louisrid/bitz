# STAKKZ BETA ONLY. Never include or adopt the production 'stakkz' service.
# This safely references an existing free test Postgres and existing free test web service.
services:
  - type: web
    name: stakkz-beta-test-20261111
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/louisrid/stakkz
    branch: beta-ui-bots-account-sync-20261111
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STAKKZ_DATABASE_URL
        fromDatabase:
          name: stakkz-beta-store
          property: connectionString

databases:
  - name: stakkz-beta-store
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
